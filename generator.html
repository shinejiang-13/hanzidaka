const GRADE_NAMES = {1:'一年级',2:'二年级',3:'三年级',4:'四年级',5:'五年级',6:'六年级'};

let generated = [];

function getCharData(char, grade) {
  try {
    // 拼音（带声调，取第一个读音）
    let pinyin = '';
    try {
      const spell = cnchar.spell(char, 'tone');
      pinyin = (Array.isArray(spell) ? spell[0] : spell) || '';
    } catch(e) {}
    pinyin = pinyin.toLowerCase();

    // 笔顺名称
    let strokes = [];
    try {
      const names = cnchar.stroke(char, 'order', 'name');
      // cnchar 返回二维数组 [[...]]，取第一个子数组
      let arr = Array.isArray(names) ? names : [];
      if (arr.length && Array.isArray(arr[0])) arr = arr[0];
      if (Array.isArray(arr) && arr.length) {
        strokes = arr.map(n => {
          // 处理 "横撇|横钩" 取第一个，去掉末尾数字如 "点2"
          return String(n).split('|')[0].replace(/\d+$/, '');
        });
      }
    } catch(e) {}

    // 组词（取前3个2字词）
    let words = [];
    try {
      const wl = cnchar.words(char) || [];
      words = wl.filter(w => w.length === 2).slice(0, 3);
    } catch(e) {}
    if (words.length < 3) {
      // 补充：用字+常见字凑词
      const suffixes = ['人','子','头','手','心','日','月','水','火','山','石','田','土','大','小','多','少'];
      for (const s of suffixes) {
        if (words.length >= 3) break;
        const w = char + s;
        if (w.length === 2 && !words.includes(w)) words.push(w);
      }
    }

    return {
      char: char,
      pinyin: pinyin || char,
      strokes: strokes,
      words: words.slice(0, 3),
      grade: grade
    };
  } catch(e) {
    return { char, pinyin: '', strokes: [], words: [], grade };
  }
}

async function generate() {
  const btn = document.getElementById('start');
  btn.disabled = true;
  const total = Object.values(GRADE_CHARS).reduce((s,c) => s + c.length, 0);
  document.getElementById('total').textContent = total;
  generated = [];
  let count = 0;

  for (const gradeStr in GRADE_CHARS) {
    const grade = parseInt(gradeStr);
    const chars = GRADE_CHARS[gradeStr];
    for (const ch of chars) {
      generated.push(getCharData(ch, grade));
      count++;
      if (count % 50 === 0) {
        document.getElementById('progress').textContent = count;
        document.getElementById('status').textContent =
          `正在生成... 年级 ${grade}/6 (${GRADE_NAMES[grade]})`;
        await new Promise(r => setTimeout(r, 10));
      }
    }
  }

  document.getElementById('progress').textContent = total;
  document.getElementById('status').textContent = '生成完成！';

  // 输出为 JS 模块格式
  const output = 'const HANZI_DATA = ' + JSON.stringify(generated, null, 0) + ';\\n';
  document.getElementById('output').value = output;
  document.getElementById('copy').disabled = false;
}

document.getElementById('start').addEventListener('click', generate);
document.getElementById('copy').addEventListener('click', () => {
  const ta = document.getElementById('output');
  ta.select();
  document.execCommand('copy');
  document.getElementById('copy').textContent = '已复制！';
});

// 检测 cnchar 是否加载
window.addEventListener('load', () => {
  if (typeof cnchar !== 'undefined') {
    document.getElementById('status').textContent = 'cnchar 加载完成，可以开始生成';
    document.getElementById('start').disabled = false;
  } else {
    document.getElementById('status').textContent = 'cnchar 加载失败，请检查网络';
  }
});
